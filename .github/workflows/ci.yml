name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
          uv run --no-sync playwright install --with-deps chromium
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Typecheck
        run: uv run --no-sync mypy src
      - name: Test (incl. browser end-to-end)
        run: uv run --no-sync pytest -q
      - name: Benchmark gate (mock pipeline)
        run: uv run --no-sync scrutai eval --min-precision 0.95 --min-recall 0.8 --report eval-report.md
      - name: Publish benchmark report
        if: always()
        run: test -f eval-report.md && cat eval-report.md >> "$GITHUB_STEP_SUMMARY" || true

  mcp-v2:
    # The main job tests the MCP server on SDK 1.x (CrewAI pins mcp~=1.28);
    # this one runs the same tests on 2.x, without CrewAI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e . "mcp>=2" pytest httpx pyyaml
      - name: Check the SDK major
        run: uv run --no-sync python -c "from scrutai.mcp.compat import MCP_MAJOR; assert MCP_MAJOR == 2, MCP_MAJOR"
      - name: MCP tests on mcp 2.x
        run: uv run --no-sync pytest -q tests/test_mcp_server.py tests/test_mcp_transports.py tests/test_mcp_github.py tests/test_mcp_benchmark.py tests/test_mcp_prompts.py

  package:
    # What `pip install scrutai` gets: build, check the PyPI metadata, run the wheel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: The wheel works outside the repository
        run: |
          uv venv /tmp/wheel --python 3.12
          uv pip install --python /tmp/wheel/bin/python "$(ls dist/*.whl)[web,mcp]"
          cd /tmp
          /tmp/wheel/bin/scrutai review --demo || test $? -eq 1
          /tmp/wheel/bin/scrutai eval --min-precision 0.95 --min-recall 0.8

  windows:
    # Windows decodes text with the legacy code page (cp1252) by default; a review of a
    # diff with a curly quote or an emoji must still work there, without PYTHONUTF8.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[web,mcp]"
      - name: Review on Windows with UTF-8 mode off
        shell: pwsh
        env:
          PYTHONUTF8: "0"
        run: |
          function Check($what) { if ($LASTEXITCODE -gt 1) { Write-Error "$what failed ($LASTEXITCODE)"; exit 1 } }
          scrutai review --demo -f markdown -o demo.md; Check "demo review"
          git init -q -b main utf8; Set-Location utf8
          git config user.email ci@example.com; git config user.name ci
          "x = 1" | Out-File -Encoding utf8NoBOM app.py
          git add -A; git commit -q -m base; git checkout -q -b feature
          'MSG = "don’t panic 🚀"' | Out-File -Encoding utf8NoBOM -Append app.py
          git commit -q -am change
          scrutai review --base main --head feature -f markdown -o review.md; Check "UTF-8 diff review"
          if (-not (Select-String -Path review.md -Pattern "Scrutai review" -Quiet)) { Write-Error "empty report"; exit 1 }
          Set-Location ..
          scrutai eval --min-precision 0.95 --min-recall 0.8; Check "eval"
          exit 0

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build and check the committed bundle is up to date
        run: |
          npm run build
          git diff --exit-code -- ../src/scrutai/web/static \
            || { echo "::error::Rebuild the UI (cd web && npm run build) and commit src/scrutai/web/static"; exit 1; }
