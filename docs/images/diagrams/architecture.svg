<svg width="1400" height="820" viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}

.t{font-size:15px;fill:#1f2330}.s{font-size:12.5px;fill:#5b6170}.h{font-size:13px;font-weight:700;fill:#6d4aff;letter-spacing:.06em}
.box{fill:#f6f5ff;stroke:#c9bfff;stroke-width:1.4}.node{fill:#fff;stroke:#6d4aff;stroke-width:1.8}
.crit{fill:#fff4ec;stroke:#e8772e;stroke-width:1.8}.out{fill:#f2faf5;stroke:#3a9a62;stroke-width:1.4}
.ln{stroke:#7b8193;stroke-width:1.6;fill:none;marker-end:url(#a)}.lo{stroke:#e8772e;stroke-width:1.8;fill:none;marker-end:url(#b)}
</style>
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#7b8193"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#e8772e"/></marker></defs>
<text x="40" y="44" style="font-size:24px;font-weight:700;fill:#1f2330">Scrutai architecture</text>
<text x="40" y="70" class="s">Every surface is a thin consumer of one library call: review_diff()</text>
<!-- surfaces -->
<text x="40" y="118" class="h">SURFACES</text>
<g>
<rect x="40" y="130" width="220" height="54" rx="10" class="box"/><text x="58" y="154" class="t">CLI</text><text x="58" y="173" class="s">scrutai review · eval</text>
<rect x="40" y="196" width="220" height="54" rx="10" class="box"/><text x="58" y="220" class="t">GitHub Action</text><text x="58" y="239" class="s">PR comments · SARIF</text>
<rect x="40" y="262" width="220" height="54" rx="10" class="box"/><text x="58" y="286" class="t">MCP server</text><text x="58" y="305" class="s">Claude Code · Cursor · Desktop</text>
<rect x="40" y="328" width="220" height="54" rx="10" class="box"/><text x="58" y="352" class="t">Agent theater</text><text x="58" y="371" class="s">React UI over SSE</text>
<rect x="40" y="394" width="220" height="54" rx="10" class="box"/><text x="58" y="418" class="t">Python library</text><text x="58" y="437" class="s">from scrutai import …</text>
</g>
<path d="M260 289 L318 289" class="ln"/>
<rect x="320" y="262" width="150" height="54" rx="10" class="node"/><text x="338" y="286" class="t">review_diff()</text><text x="338" y="305" class="s">diff → chunks</text>
<!-- graph -->
<text x="510" y="118" class="h">LANGGRAPH PIPELINE</text>
<rect x="500" y="130" width="860" height="400" rx="14" fill="none" stroke="#e3e0f5" stroke-dasharray="5 5"/>
<path d="M470 289 L528 289" class="ln"/>
<rect x="530" y="262" width="120" height="54" rx="10" class="node"/><text x="548" y="286" class="t">route</text><text x="548" y="305" class="s">who to wake</text>
<!-- specialists -->
<g>
<rect x="700" y="146" width="190" height="44" rx="10" class="node"/><text x="716" y="174" class="t">security</text>
<rect x="700" y="200" width="190" height="44" rx="10" class="node"/><text x="716" y="228" class="t">correctness</text>
<rect x="700" y="254" width="190" height="44" rx="10" class="node"/><text x="716" y="282" class="t">tests</text>
<rect x="700" y="308" width="190" height="44" rx="10" class="node"/><text x="716" y="336" class="t">performance</text>
<rect x="700" y="362" width="190" height="44" rx="10" class="node"/><text x="716" y="390" class="t">style</text>
</g>
<path d="M650 289 C675 289 675 168 698 168" class="ln"/><path d="M650 289 C675 289 675 222 698 222" class="ln"/><path d="M650 289 L698 276" class="ln"/><path d="M650 289 C675 289 675 330 698 330" class="ln"/><path d="M650 289 C675 289 675 384 698 384" class="ln"/>
<text x="700" y="430" class="s">ReAct loop per (specialist, chunk), run concurrently</text>
<text x="700" y="448" class="s">tools: read_file · grep · git_blame · semgrep</text>
<path d="M890 168 C915 168 915 289 938 289" class="ln"/><path d="M890 222 C915 222 915 289 938 289" class="ln"/><path d="M890 276 L938 287" class="ln"/><path d="M890 330 C915 330 915 289 938 289" class="ln"/><path d="M890 384 C915 384 915 289 938 289" class="ln"/>
<rect x="940" y="262" width="120" height="54" rx="10" class="node"/><text x="958" y="286" class="t">collect</text><text x="958" y="305" class="s">merge · dedupe</text>
<path d="M1060 289 L1098 289" class="ln"/>
<rect x="1100" y="262" width="120" height="54" rx="10" class="crit"/><text x="1118" y="286" class="t">critic</text><text x="1118" y="305" class="s">put on trial</text>
<rect x="1100" y="146" width="120" height="54" rx="10" class="crit"/><text x="1118" y="170" class="t">defend</text><text x="1118" y="189" class="s">or withdraw</text>
<path d="M1140 262 L1140 202" class="lo"/><path d="M1180 200 L1180 260" class="lo"/>
<text x="1228" y="222" class="s" style="fill:#e8772e">challenge</text><text x="1228" y="240" class="s" style="fill:#e8772e">≤ max rounds</text>
<path d="M1160 316 L1160 368" class="ln"/>
<rect x="1100" y="370" width="120" height="54" rx="10" class="node"/><text x="1118" y="394" class="t">verdict</text><text x="1118" y="413" class="s">typed result</text>
<!-- outputs -->
<text x="40" y="588" class="h">LLM CLIENT STACK (every call passes through, outermost first)</text>
<g>
<rect x="40" y="604" width="190" height="54" rx="10" class="box"/><text x="58" y="628" class="t">Tracing</text><text x="58" y="647" class="s">JSONL · OTel · Langfuse</text>
<path d="M230 631 L258 631" class="ln"/>
<rect x="260" y="604" width="190" height="54" rx="10" class="box"/><text x="278" y="628" class="t">Cancellable</text><text x="278" y="647" class="s">stop without corruption</text>
<path d="M450 631 L478 631" class="ln"/>
<rect x="480" y="604" width="190" height="54" rx="10" class="box"/><text x="498" y="628" class="t">Budgeted</text><text x="498" y="647" class="s">token and $ caps</text>
<path d="M670 631 L698 631" class="ln"/>
<rect x="700" y="604" width="190" height="54" rx="10" class="box"/><text x="718" y="628" class="t">ErrorCounting</text><text x="718" y="647" class="s">no silent "clean" reviews</text>
<path d="M890 631 L918 631" class="ln"/>
<rect x="920" y="604" width="190" height="54" rx="10" class="node"/><text x="938" y="628" class="t">LiteLLM | Mock</text><text x="938" y="647" class="s">any provider, or offline</text>
</g>
<text x="1176" y="588" class="h">OUTPUTS</text>
<path d="M1160 424 L1160 600" class="ln"/>
<rect x="1140" y="604" width="220" height="150" rx="10" class="out"/>
<text x="1158" y="630" class="t">ReviewResult (Pydantic)</text>
<text x="1158" y="656" class="s">• Markdown / JSON report</text><text x="1158" y="678" class="s">• SARIF for code scanning</text>
<text x="1158" y="700" class="s">• PR summary + inline comments</text><text x="1158" y="722" class="s">• dropped findings, with reasons</text><text x="1158" y="744" class="s">• trace of every decision</text>
<text x="40" y="720" class="s">A review with no successful model call is never "approve". Anything the critic could not judge is withheld.</text>
</svg>
