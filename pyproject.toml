[project]
name = "scrutai"
version = "0.1.0"
description = "Multi-agent code reviewer that puts every finding on trial before it reaches your PR."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Karthik N R", email = "you@example.com" }]
keywords = ["multi-agent", "code-review", "langgraph", "react-agent", "llm", "self-reflection"]
dependencies = [
    "langgraph>=0.2.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "litellm>=1.40",       # provider-agnostic LLM calls (optional at runtime)
]

[project.optional-dependencies]
semgrep = ["semgrep>=1.70"]
otel = ["opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24"]
langfuse = ["langfuse>=2.0"]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "opentelemetry-sdk>=1.24",  # exercises the otel tracing path in tests
]

[project.scripts]
scrutai = "scrutai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrutai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    # Emitted inside litellm's own pydantic models; not actionable here.
    "ignore:Item 'summary' on TypedDict class:UserWarning",
]
